<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロフィール</title>
  <style>
    .profile-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      max-width: 500px;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }
    .profile-card h2 {
      margin-top: 0;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .profile-item {
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .label {
      font-weight: bold;
      color: #555;
      display: inline-block;
      width: 120px;
    }
  </style>
</head>
<body>

<div class="profile-card">
  <h2>自己紹介</h2>
  <div class="profile-item"><span class="label">名前：</span>松田 圭太郎（まつだ けいたろう）</div>
  <div class="profile-item"><span class="label">年齢：</span>20歳</div>
  <div class="profile-item"><span class="label">出身地：</span>埼玉県さいたま市</div>
  <div class="profile-item"><span class="label">現在の居住地：</span>埼玉県さいたま市</div>
  <div class="profile-item"><span class="label">職業：</span>学生</div>
  <div class="profile-item"><span class="label">趣味：</span>旅行</div>
  <div class="profile-item"><span class="label">特技：</span>空気読み</div>
  <div class="profile-item"><span class="label">好きな食べ物：</span>おにぎり、うどん、ラーメン</div>
  <div class="profile-item"><span class="label">苦手なもの：</span>怒られること</div>
  <div class="profile-item"><span class="label">MBTI：</span>わすれた</div>
  <div class="profile-item"><span class="label">座右の銘：</span>これぞ私の生きる道</div>
</div>

</body>
</html>
