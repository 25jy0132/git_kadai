<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>プロフィール</title>
  <style>
    .profile-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      max-width: 500px;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }
    .profile-card h2 {
      margin-top: 0;
      border-bottom: 2px solid #333;
      padding-bottom: 10px;
    }
    .profile-item {
      margin-bottom: 10px;
      line-height: 1.6;
    }
    .label {
      font-weight: bold;
      color: #555;
      display: inline-block;
      width: 120px;
    }
  </style>
</head>
<body>

<div class="profile-card">
  <h2>自己紹介</h2>
  <div class="profile-item"><span class="label">名前：</span>山田 太郎（やまだ たろう）</div>
  <div class="profile-item"><span class="label">年齢：</span>28歳</div>
  <div class="profile-item"><span class="label">出身地：</span>北海道 札幌市</div>
  <div class="profile-item"><span class="label">現在の居住地：</span>東京都 新宿区</div>
  <div class="profile-item"><span class="label">職業：</span>Webエンジニア</div>
  <div class="profile-item"><span class="label">趣味：</span>読書、サウナ、スパイスカレー作り</div>
  <div class="profile-item"><span class="label">特技：</span>どこでもすぐに眠れること</div>
  <div class="profile-item"><span class="label">好きな食べ物：</span>寿司、焼肉、ブラックコーヒー</div>
  <div class="profile-item"><span class="label">苦手なもの：</span>満員電車、ホラー映画</div>
  <div class="profile-item"><span class="label">MBTI：</span>INFP（仲介者）</div>
  <div class="profile-item"><span class="label">座右の銘：</span>思い立ったが吉日</div>
  <div class="profile-item"><span class="label">休日の過ごし方：</span>午前中はカフェでプログラミングの勉強をして、午後は愛犬と散歩に出かけます。</div>
</div>

</body>
</html>
